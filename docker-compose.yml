version: "3.8"

# This is a starting-point docker-compose for local dev/testing.
# Harbor's official installer generates a much more complete
# docker-compose.yml (with nginx, jobservice, trivy, etc.) from
# harbor.yml. For a real deployment, use Harbor's official installer:
# https://github.com/goharbor/harbor/releases
#
# Note: keycloak is mapped to host port 8881 (not 8880) to avoid
# conflicting with harbor-core, which also listens on 8880.

services:
  harbor-db:
    image: goharbor/harbor-db:v2.12.0
    environment:
      POSTGRES_PASSWORD: root123
    volumes:
      - harbor-db-data:/var/lib/postgresql/data

  harbor-redis:
    image: goharbor/redis-photon:v2.12.0

  harbor-registry:
    image: goharbor/registry-photon:v2.12.0
    volumes:
      - registry-data:/storage

  harbor-core:
    image: goharbor/harbor-core:v2.12.0
    depends_on:
      - harbor-db
      - harbor-redis
      - harbor-registry
    environment:
      DATABASE_TYPE: postgresql
      POSTGRESQL_HOST: harbor-db
      POSTGRESQL_PORT: 5432
      POSTGRESQL_USERNAME: postgres
      POSTGRESQL_PASSWORD: root123
      POSTGRESQL_DATABASE: registry
      _REDIS_URL_CORE: redis://harbor-redis:6379/0
      HARBOR_ADMIN_PASSWORD: Harbor12345
      CONFIG_PATH: /etc/core/app.conf
    ports:
      - "8880:8080"

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: start-dev
    environment:
      KC_HTTP_PORT: 8080
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8881:8080"

  harbor-mcp:
    build: .
    depends_on:
      - harbor-core
      - keycloak
    environment:
      HARBOR_URL: http://harbor-core:8080
      HARBOR_ROBOT_NAME: robot$$harbor-mcp
      HARBOR_ROBOT_SECRET: changeme
      OAUTH_UPSTREAM_ISSUER: http://keycloak:8080/realms/harbor
      OAUTH_UPSTREAM_CLIENT_ID: harbor-mcp
      OAUTH_UPSTREAM_CLIENT_SECRET: changeme
      SERVER_BASE_URL: http://localhost:8080
    ports:
      - "8080:8080"

volumes:
  harbor-db-data:
  registry-data:
